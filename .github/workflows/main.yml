name: Deploy to Windows Server

on:
  push:
    branches:
      - main  # Скрипт сработает, когда файлы сохранят в главную ветку

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Copy files via SFTP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        source: "plugins/*"  # Скрипт будет брать всё из папки plugins на гитхабе
        target: "C:/Users/${{ secrets.SERVER_USER }}/AppData/Roaming/EXILED/"
