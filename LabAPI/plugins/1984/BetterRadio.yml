# =====================================================================
#             КОНФИГ ПЛАГИНА СВОБОДНЫХ РАДИОЧАСТОТ [BetterRadio]
# =====================================================================

# Включение плагина (true - работает, false - выключен)
is_enabled: true

# Режим отладки для администратора (оставь false, чтобы не спамило в консоль)
debug_enabled: false

# Настройка системных ограничений для ввода частот
# Позволяет игрокам вручную вбивать любые цифры в этом диапазоне
min_frequency: 1.1
max_frequency: 999.9

# Сколько символов после точки может быть в частоте (например: 145.1 - это 1 знак)
frequency_precision: 1

# Сообщение, которое видит игрок при успешной смене частоты в консоли
# Поддерживает стандартные цветовые теги Unity
change_success_message: '<color=green>Рация успешно перенастроена на частоту: {frequency} МГц</color>'

# Сообщение об ошибке, если игрок ввел бред (например, буквы вместо цифр или частоту 1000.0)
change_error_message: '<color=red>Ошибка! Частота должна быть строго числом от 1.1 до 999.9</color>'


# =====================================================================
#         АВТОМАТИЧЕСКИЕ СТАРТОВЫЕ ЧАСТОТЫ ДЛЯ ФРАКЦИЙ ПРИ СПАВНЕ
# =====================================================================
# Здесь настроена логика: персонал Фонда привязан к одной частоте безопасности,
# а Повстанцы Хаоса (Синдикат) отрезаны от них и координируются на своей волне.

default_frequencies:
  # Охрана Зоны (Служба Безопасности)
  FacilityGuard: 145.0
  
  # Научный персонал (Учёные)
  Scientist: 145.0
  
  # Мобильная Оперативная Группа (МОГ / Подкрепление Фонда)
  NineTailedFox: 145.0
  
  # Класс Д (Если найдут рацию на полу — автоматически будут на этой же волне)
  ClassD: 145.0
  
  # Повстанцы Хаоса (Аналог Синдиката. Изначально изолированы на секретной частоте!)
  ChaosInsurgency: 120.0


# =====================================================================
#           ДОПОЛНИТЕЛЬНЫЕ ОПЦИИ ДЛЯ КЛИЕНТСКИХ КОМАНД (.radio)
# =====================================================================

# Разрешить ли игрокам полностью выключать рацию командой .radio off
allow_turning_off: true

# Скрывать ли текстовые команды смены частоты из общего чата (чтобы другие не шпионили за вводом)
hide_commands_from_chat: true
